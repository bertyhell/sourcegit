name: Release
on:
  push:
    tags:
      - v*
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Output version string
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    # macOS/Windows builds are optional and can fail without ever starting (e.g. "job was not
    # acquired by Runner" when macOS arm64 capacity runs out). continue-on-error does not cover
    # that, so the build counts as failed: run anyway unless the whole run was cancelled.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [package, version]
    name: Release
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package.*
          path: packages
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l packages
          # Linux packages are required: never publish a release without them
          for arch in amd64 arm64; do
            if [ ! -f "packages/sourcegit-$VERSION.linux.$arch.AppImage" ]; then
              echo "::error::Linux $arch package is missing; not releasing."
              exit 1
            fi
          done
          if ! ls packages/*.osx-* >/dev/null 2>&1; then
            echo "::warning::No macOS packages were built; releasing without them."
          fi
          if ! ls packages/*.win-* >/dev/null 2>&1; then
            echo "::warning::No Windows packages were built; releasing without them."
          fi
          gh release create "$TAG" -t "$VERSION" --notes-from-tag packages/*
